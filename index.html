<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎓 Student Result Management System</h1>
</header>

<div class="container">
    <h2>Enter Student Details</h2>

    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="roll" placeholder="Roll Number">

    <div class="marks">
        <input type="number" id="m1" placeholder="Web Technology">
        <input type="number" id="m2" placeholder="DBMS">
        <input type="number" id="m3" placeholder="Java">
        <input type="number" id="m4" placeholder="Python">
        <input type="number" id="m5" placeholder="Cloud Computing">
    </div>

    <button onclick="calculateResult()">Calculate Result</button>

    <div id="result"></div>
</div>

<footer>
    © 2026 Student Result Management System
</footer>

<script src="script.js"></script>
</body>
</html>
